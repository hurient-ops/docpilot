<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>DocPilot AI</title>
    <!-- Office JavaScript API -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 10px; background-color: #FAFAFA;}
        .button { background-color: #6366F1; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px;}
        .button:hover { background-color: #4F46E5; }
    </style>
</head>
<body>
    <h2>DocPilot AI</h2>
    <p>현재 문서의 내용을 AI가 검토하고 자동으로 구조를 스캔합니다.</p>
    <button class="button" id="scanBtn">문서 스캔 및 인덱싱</button>
    <button class="button" id="insertBtn" style="background-color: #10B981; margin-top:5px;">AI 제안 내용 삽입</button>
    <div id="status" style="margin-top: 10px; font-size: 12px; color: #555;"></div>

    <script>
        Office.onReady((info) => {
            document.getElementById("scanBtn").onclick = () => {
                document.getElementById("status").innerText = "DocPilot 로컬 백엔드 서버로 전송 중...";
                // fetch('http://localhost:8000/api/v1/scan', ...) 로 로컬 파이썬 엔진 호출
            };
            
            document.getElementById("insertBtn").onclick = () => {
                // Word 문서의 현재 커서 위치에 텍스트 삽입 예제
                if (info.host === Office.HostType.Word) {
                    Word.run(context => {
                        const doc = context.document;
                        doc.body.insertParagraph("DocPilot AI가 추천하는 추가 조항입니다.", Word.InsertLocation.end);
                        return context.sync();
                    }).catch(error => {
                        console.error(error);
                    });
                }
            };
        });
    </script>
</body>
</html>
